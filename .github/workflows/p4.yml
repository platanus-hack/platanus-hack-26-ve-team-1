name: p4

on:
  push:
    paths: &paths
      - "app/lib/slj/**"
      - "tools/slj/**"
      - "app/public/p4-lab/**"
      - "docs/p4-*.md"
      - "render.yaml"
      - ".github/workflows/p4.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: node --test "app/lib/slj/**/*.test.ts"

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/slj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/slj/go.mod
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -run xxx -fuzz=FuzzVerifyPresentation -fuzztime=20s

  # Interoperabilidad: Go firma → WebCrypto verifica, y WebCrypto firma → Go verifica, con material recién generado.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/slj/go.mod
      - run: go run . vectors -out ../../app/lib/slj/testdata/vectors.json
        working-directory: tools/slj
      - run: node --test "app/lib/slj/conformance.test.ts"
        env:
          SLJ_REGEN: "1"
      - run: go test -count=1 -run 'TestVectorsRoundTrip|TestVerifyTSPresentation|TestVectorsFileMatchesGenerator' ./...
        working-directory: tools/slj
