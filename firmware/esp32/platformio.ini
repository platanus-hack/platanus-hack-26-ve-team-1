; PlatformIO Project Configuration File
; SoloLoJusto - P2 Terminal Firmware (ESP32)
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; El ESP32 se busca por el ID USB de su CP2102, no por el COM: el número cambia de un PC
; a otro y en una laptop COM7 o COM10 pueden ser Bluetooth. Con el UNO o el PIC también
; conectados, la detección automática de PlatformIO podría elegir uno de ellos
upload_port = hwgrep://10C4:EA60
monitor_port = hwgrep://10C4:EA60
upload_speed = 115200

build_flags =
  -D CORE_DEBUG_LEVEL=1

lib_deps =
  miguelbalboa/MFRC522@^1.4.11
  kmackay/micro-ecc@^1.0.0
  bblanchon/ArduinoJson@^7.4.0
