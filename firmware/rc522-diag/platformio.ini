; Diagnóstico aislado del RC522 en el ESP32 (mismos pines que firmware/esp32).
; Sin gateway, hora ni consentimiento: solo el lector y la tarjeta.
; Uso y lectura de resultados: README.md. Al terminar, volver a grabar firmware/esp32.

[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_port = hwgrep://10C4:EA60
monitor_port = hwgrep://10C4:EA60
upload_speed = 115200

lib_deps =
  miguelbalboa/MFRC522@^1.4.11
